name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Sources parse (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every module
        run: python -m compileall -q GmlFinal
      - name: Check the run config parses
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, yaml
          cfg = yaml.safe_load(pathlib.Path('GmlFinal/asl-graphs/config/asl.yaml').read_text())
          assert cfg['train_type'] in {'graphs', 'lstm'}, cfg['train_type']
          assert cfg['pose_type'] in {'no_pose', 'no_face', 'no_hands', 'only_hands'}
          print('config ok:', cfg['height'], 'x', cfg['width'], cfg['pose_type'], cfg['epochs'], 'epochs')
          PY
